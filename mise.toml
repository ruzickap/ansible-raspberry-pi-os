[tools]
ansible = "14.5.0"
fnox = "1.39.0"

[tasks.run]
description = "Run Ansible playbook"
dir = "ansible"
shell = "bash -c"
run = """
set -euo pipefail
ansible-galaxy install -r requirements.yml
fnox exec -- ansible-playbook --diff -i inventory/hosts main.yml 2>&1 | tee /tmp/ansible-raspberry-pi-os.log
"""
